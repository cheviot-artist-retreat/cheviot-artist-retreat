<html lang="en">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg-canvas: #f6f5f2;
            --bg-card: #ffffff;
            --bg-dark: #1e2522;
            --text-main: #2b302c;
            --text-muted: #626963;
            --text-light: #f6f5f2;
            --brand-pine: #2e4036;
            --brand-pine-hover: #223129;
            --brand-ochre: #c88a4c;
            --brand-heather: #786470;
            --border-subtle: #e2dfd7;
            --accent-soft: #eae7df;
            --font-heading: 'Cinzel', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-heading);
            letter-spacing: 0.02em;
            color: var(--brand-pine);
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(246, 245, 242, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 0;
        }

        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--brand-pine);
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: var(--brand-pine);
            color: var(--bg-canvas);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .logo-subtitle {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--brand-ochre);
            margin-top: 2px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
        }

        nav a:hover {
            color: var(--brand-ochre);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--brand-pine);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--brand-pine-hover);
        }

        .btn-outline {
            background: transparent;
            border-color: var(--brand-pine);
            color: var(--brand-pine);
        }

        .hero {
            padding: 4rem 0 5rem;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3.5rem;
            align-items: center;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            background: var(--accent-soft);
            border: 1px solid var(--border-subtle);
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--brand-pine);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .hero h1 {
            font-size: 3rem;
            line-height: 1.15;
            margin-bottom: 1.5rem;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            max-width: 540px;
        }

        .hero-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .hero-image-wrapper {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .hero-image-wrapper img {
            width: 100%;
            height: 480px;
            object-fit: cover;
            display: block;
        }

        .hero-image-badge {
            position: absolute;
            bottom: 1.5rem;
            left: 1.5rem;
            right: 1.5rem;
